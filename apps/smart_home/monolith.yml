openapi: '3.1.1'
info:
  title: smart home
  version: '1.0'
servers:
  - url: http://localhost:8080/api/v1/
paths:
  /sensors: 
    get:
      description: 'Get data from all temperature sensors'
      parameters: []
      responses:
        '200':
          description: OK

    put:
      description: 'Create default sensor'
      parameters: []
      responses:
        '200':
          description: OK
  /sensors/{id}:
    get:
      description: 'Get sensor data by id'
      parameters: []
      responses:
        '200':
          description: OK
    put:
      description: ''
      parameters: []
      responses:
        '200':
          description: OK
    delete:
      description: ''
      parameters: []
      responses:
        '200':
          description: OK
  /sensors/{id}/{value}:
    patch:
      description: 'Update value for sensor by sensor ID'
      parameters: []
      responses:
        '200':
          description: OK
  /sensors/temperature/{location}:
    get:
      description: 'Температура по локации'
      parameters: []
      responses:
        '200':
          description: OK